<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelMate — Log In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">

    <h1 class="auth-title">✈️ TravelMate</h1>
    <p class="auth-subtitle">Log in to your account</p>

    <!-- Same pattern as register.html: empty by default, JS fills
         it in with an error/success message when needed. -->
    <div id="formMessage" class="form-message" style="display: none;"></div>

    <form id="loginForm" class="auth-form">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password">

      <button type="submit" id="loginBtn">Log In</button>

    </form>

    <p class="auth-footer">
      Don't have an account? <a href="register.html">Create one</a>
    </p>

  </div>
</div>

<script>
  const API_BASE = 'http://localhost:3000';

  const form       = document.getElementById('loginForm');
  const messageBox = document.getElementById('formMessage');
  const loginBtn   = document.getElementById('loginBtn');

  function showMessage(text, type) {
    messageBox.textContent = text;
    messageBox.className = 'form-message ' + type; // 'error' or 'success'
    messageBox.style.display = 'block';
  }

  form.addEventListener('submit', async function (event) {
    event.preventDefault();

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    // ── FRONTEND VALIDATION ──────────────────────────────────
    // Just "did you fill both fields" — anything deeper (is this
    // email/password combo actually correct) can ONLY be answered
    // by the server, since only it can check the database.
    if (!email || !password) {
      showMessage('Please enter both email and password.', 'error');
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = 'Logging in...';

    try {
      const response = await fetch(`${API_BASE}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },

        // credentials: 'include' is IMPORTANT here — it tells the
        // browser "send and accept cookies on this request even
        // though it's going to a different port/origin than the
        // page itself (localhost:3000 vs. wherever this HTML file
        // is served from)." Without this, the session cookie the
        // server tries to set would be silently dropped, and the
        // login would appear to succeed but not actually "stick".
        credentials: 'include',

        body: JSON.stringify({ email, password })
      });

      const data = await response.json();

      if (!response.ok) {
        showMessage(data.error || 'Login failed. Please try again.', 'error');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
        return;
      }

      showMessage(`Welcome back, ${data.user.name}! Redirecting...`, 'success');

      setTimeout(function () {
        window.location.href = 'index.html';
      }, 1000);

    } catch (error) {
      console.error('Login request failed:', error);
      showMessage('Could not reach the server. Is it running?', 'error');
      loginBtn.disabled = false;
      loginBtn.textContent = 'Log In';
    }
  });
</script>

</body>
</html>
