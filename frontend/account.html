<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelMate — My Account</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">

    <h1 class="auth-title">✈️ TravelMate</h1>
    <p class="auth-subtitle">My Account</p>

    <!-- ── ACCOUNT INFO ─────────────────────────────────────── -->
    <!-- Filled in by loadAccount() once the page loads — starts
         empty so there's nothing wrong-looking to flash on screen. -->
    <div id="accountInfo" class="account-info"></div>

    <hr class="account-divider">

    <!-- ── CHANGE PASSWORD ──────────────────────────────────── -->
    <h2 class="account-section-title">Change Password</h2>

    <div id="passwordMessage" class="form-message" style="display: none;"></div>

    <form id="passwordForm" class="auth-form">

      <label for="currentPassword">Current Password</label>
      <input type="password" id="currentPassword" name="currentPassword" placeholder="Your current password" autocomplete="current-password">

      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" name="newPassword" placeholder="At least 6 characters" autocomplete="new-password">

      <label for="confirmNewPassword">Confirm New Password</label>
      <input type="password" id="confirmNewPassword" name="confirmNewPassword" placeholder="Re-enter new password" autocomplete="new-password">

      <button type="submit" id="passwordBtn">Update Password</button>

    </form>

    <p class="auth-footer">
      <a href="index.html">← Back to TravelMate</a>
    </p>

  </div>
</div>

<script>
  const API_BASE = 'http://localhost:3000';

  const accountInfoEl   = document.getElementById('accountInfo');
  const passwordForm    = document.getElementById('passwordForm');
  const passwordMessage = document.getElementById('passwordMessage');
  const passwordBtn     = document.getElementById('passwordBtn');

  function showMessage(text, type) {
    passwordMessage.textContent = text;
    passwordMessage.className = 'form-message ' + type; // 'error' or 'success'
    passwordMessage.style.display = 'block';
  }

  // -------------------------------------------------------
  // loadAccount()
  //   Fetches GET /api/account and displays name/email/member-since.
  //   The server.js page guard already blocks logged-out visitors
  //   from reaching this HTML file at all — this fetch is just to
  //   get the actual account DATA to display.
  // -------------------------------------------------------
  async function loadAccount() {
    try {
      const response = await fetch(`${API_BASE}/api/account`, {
        credentials: 'include'
      });
      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Could not load account info.');
      }

      const user = data.user;

      // toLocaleDateString() turns the raw timestamp into something
      // readable, e.g. "July 21, 2026", instead of a raw ISO string.
      const memberSince = new Date(user.created_at).toLocaleDateString(undefined, {
        year: 'numeric', month: 'long', day: 'numeric'
      });

      accountInfoEl.innerHTML = `
        <p class="account-field"><strong>Name:</strong> ${user.name}</p>
        <p class="account-field"><strong>Email:</strong> ${user.email}</p>
        <p class="account-field"><strong>Member since:</strong> ${memberSince}</p>
      `;

    } catch (error) {
      accountInfoEl.innerHTML = `<p class="account-field">Could not load account info.</p>`;
      console.error('Failed to load account:', error);
    }
  }

  // -------------------------------------------------------
  // Change Password form submit
  // -------------------------------------------------------
  passwordForm.addEventListener('submit', async function (event) {
    event.preventDefault();

    const currentPassword    = document.getElementById('currentPassword').value;
    const newPassword        = document.getElementById('newPassword').value;
    const confirmNewPassword = document.getElementById('confirmNewPassword').value;

    // ── FRONTEND VALIDATION ──────────────────────────────────
    if (!currentPassword || !newPassword || !confirmNewPassword) {
      showMessage('Please fill in all fields.', 'error');
      return;
    }

    if (newPassword.length < 6) {
      showMessage('New password must be at least 6 characters long.', 'error');
      return;
    }

    if (newPassword !== confirmNewPassword) {
      showMessage('New passwords do not match.', 'error');
      return;
    }

    passwordBtn.disabled = true;
    passwordBtn.textContent = 'Updating...';

    try {
      const response = await fetch(`${API_BASE}/api/account/password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ currentPassword, newPassword })
      });

      const data = await response.json();

      if (!response.ok) {
        showMessage(data.error || 'Could not update password.', 'error');
        passwordBtn.disabled = false;
        passwordBtn.textContent = 'Update Password';
        return;
      }

      showMessage('Password updated successfully!', 'success');
      passwordForm.reset();
      passwordBtn.disabled = false;
      passwordBtn.textContent = 'Update Password';

    } catch (error) {
      console.error('Password update request failed:', error);
      showMessage('Could not reach the server. Is it running?', 'error');
      passwordBtn.disabled = false;
      passwordBtn.textContent = 'Update Password';
    }
  });

  document.addEventListener('DOMContentLoaded', loadAccount);
</script>

</body>
</html>
